spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/settlements}
    username: ${SPRING_DATASOURCE_USERNAME:settlements}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}

  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  storage:
    root: ${APP_STORAGE_ROOT:./storage/documents}
