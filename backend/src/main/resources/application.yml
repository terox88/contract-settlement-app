spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/settlements}
    username: ${SPRING_DATASOURCE_USERNAME:settlements}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}

  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  storage:
    root: ${APP_STORAGE_ROOT:./storage/documents}

  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}


server:
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SESSION_COOKIE_SECURE:false}