services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/settlements
      SPRING_DATASOURCE_USERNAME: settlements
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_STORAGE_ROOT: /data/documents
    volumes:
      - ./storage/documents:/data/documents

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: settlements
      POSTGRES_USER: settlements
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlements -d settlements"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
